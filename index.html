<!DOCTYPE html>
<html lang=en>
    <head>
        <!-- Login Form --- Login + Register Form with Animation | HTML CSS -->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login/Register Page</title>
        <link rel="icon" type="image/x-icon" href="welcomepage/gallery/s7.png">        
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
    </head>
    <body>
            
    <div class="container">        
            <!-- Login Form -->
        <div class="form-box login">       
        <form id="loginForm" action="#">
            <h1>Login</h1>
            <div class="input-box">
            <input type ="text" id="userInput" name="user" placeholder="Username" required>
                <i class="fa-solid fa-user"></i>
            </div>
             <div class="input-box">
            <input type ="password" id="passInput" name="pass" placeholder="Password" required>
                <i class="fa-solid fa-lock"></i>
                 </div>
                 <div class="forgot-link">
                 <a href="#">Forgot Password?</a>
                 </div>
                 <button type="submit" class="btn">Login</button>
                 <p>Or login with social platforms</p>
                <div class="social-icons">
                    <a href="#"><i class="fa-brands fa-google"></i></a>
                    <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
                    <a href="#"><i class="fa-brands fa-github"></i></a>
                    <a href="#"><i class="fa-brands fa-square-linkedin"></i></a>
            </div>
            </form>
            </div>
        
            <!-- Register Form -->
        <div class="form-box register">
      <!-- <div class="form-box login"> -->
        <form action="#">
            <h1 style="background-color: yellow">Registration</h1>
            <div class="input-box">
            <input type ="text" id="username" placeholder="Username" required>
                <i class="fa-solid fa-user"></i>
            </div>
            <div class="input-box">
            <input type ="email" placeholder="Email" required>
                <i class="fa-sharp fa-solid fa-envelope"></i>
                 </div>
             <div class="input-box">
            <input type ="password" id="password" placeholder="Password" required>
                <i class="fa-solid fa-lock"></i>
                 </div>         
                 <button type="submit" class="btn">Register</button>
                 <p>or register with social platforms</p>
                <div class="social-icons">
                    <a href="#"><i class="fa-brands fa-google"></i></a>
                    <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
                    <a href="#"><i class="fa-brands fa-github"></i></a>
                    <a href="#"><i class="fa-brands fa-square-linkedin"></i></a>
            </div>
            </form>
        <!-- </div> -->
        </div>
        
            <!-- Toggle box -->
        <div class="toggle-box">
            
            <!-- Toggle box Left -->
            <div class="toggle-panel toggle-left">
            <h1>Welcome to..</h1><br>
                <h1>System7</h1>
                <p>Don't have an account?</p>
                <button class="btn register-btn">Register</button>
            </div>
            
            <!-- Toggle box Right -->
            <div class="toggle-panel toggle-right">
                <h1>Welcome Back!</h1>
                <p>Already have an acount?</p>
                <button class="btn login-btn">Login</button>
            </div>
            
        </div>
        
            <!-- Toggle box Right -->
        
        </div>
                
        <!-- verification login -->                        
        
    <script>
            
document.getElementById("loginForm").addEventListener("submit", function(event) {
    event.preventDefault(); 

    var user = document.getElementById("userInput").value;
    var pass = document.getElementById("passInput").value;

if ( user == "root" && pass == "root") {
  document.getElementById("loginForm").reset();
        load("\welcomepage/welcome.html");
}
else if( user == "admin" && pass == "admin") {

    document.getElementById("loginForm").reset();
        load("\welcomepage/welcome.html");
}
else if( user == "admin" && pass == "123") {

    document.getElementById("loginForm").reset();
        load("\welcomepage/welcome.html");
}
else if( user == "user" && pass == "pass") {

    document.getElementById("loginForm").reset();
        load("\welcomepage/welcome.html");
}
else if( user == "admin" && pass == "2026") {

    document.getElementById("loginForm").reset();
        load("\welcomepage/welcome.html");
}
else {
     alert("The information you have entered was wrong!!");
        window.location.reload();
}
   function load(url)
    {
        location.href=url;
    }
    }); 
             
</script> 
        
        
    </body>
    <script src="script.js"></script>
</html>
